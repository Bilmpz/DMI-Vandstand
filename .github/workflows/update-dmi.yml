name: Opdater stationsliste og deploy siden

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Kun én deploy ad gangen. En deploy, der er i gang, får lov at køre færdig.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Skriver docs/data/stations.json. Svarer DMI ikke, beholdes den committede fil,
      # og programmet afslutter med kode 0, så siden stadig deployes.
      - name: Byg stations.json
        run: dotnet run --project DmiVandstand

      - name: Vis genererede filer
        run: |
          ls -la docs
          ls -la docs/data
          head -c 200 docs/data/stations.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
